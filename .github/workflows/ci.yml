name: ci

on:
  push: { branches: [main] }
  pull_request:
  # Nightly: the same checks, plus longer fuzzing and the tests on the
  # latest stable and beta Rust, so new advisories and a new Rust that
  # breaks the build show up within a day.
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:

jobs:
  # pubkit's shared Rust CI. It runs every check the Rust crate standard
  # requires (`make required` lists them): fmt, clippy, docs, doc-coverage
  # and packaging; the tests on Linux, macOS, Windows, i686 and s390x; the
  # Gherkin suite with UCUM's functional tests, the test vectors and the
  # supply-chain report; the oldest promised Rust; fuzzing; and cargo deny
  # and vet. pubunit adds its own gates: the no-float guard and the UCUM
  # table check.
  ci:
    uses: schryer/pubkit/.github/workflows/rust-ci.yml@v0.7.0
    with:
      gates: guard-floats ucum-table-check

  # The shared release workflow: on a pull request, a code change records
  # what it changes, the public API moves only as far as those changes
  # allow, and a release is the bump they require, published; on main, a
  # published version is tagged and released. CI signs nothing; the release
  # was signed when the package publet was published.
  release:
    needs: ci
    uses: schryer/pubrel/.github/workflows/release.yml@v0.5.2
    with: { pubrel-version: v0.5.2, semver-checks-version: 0.51.0 }
    permissions:
      contents: write
